
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vault Bank</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 10%, #183b70 0%, transparent 35%),
                radial-gradient(circle at 80% 90%, #123d32 0%, transparent 35%),
                linear-gradient(135deg, #050914, #0a1222 50%, #071b18);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .app {
            width: min(950px, 100%);
            min-height: 600px;
            background: rgba(10, 18, 32, 0.82);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 28px;
            box-shadow:
                0 30px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #20e58a, #159c68);
            box-shadow: 0 8px 25px rgba(32,229,138,0.25);
        }

        .secure {
            color: #73f7b5;
            font-size: 13px;
            background: rgba(32,229,138,0.08);
            border: 1px solid rgba(32,229,138,0.2);
            padding: 9px 13px;
            border-radius: 30px;
        }

        main {
            padding: 35px;
        }

        /* LOCK SCREEN */

        #lockedScreen {
            min-height: 470px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .lock {
            width: 105px;
            height: 105px;
            border-radius: 30px;
            display: grid;
            place-items: center;
            font-size: 48px;
            margin-bottom: 25px;
            background: linear-gradient(145deg, #152b4d, #0c1729);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow:
                0 20px 50px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 5vw, 48px);
        }

        .subtitle {
            color: #8d9bb2;
            margin: 12px 0 28px;
        }

        .code-box {
            display: flex;
            gap: 10px;
            width: min(420px, 100%);
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 17px;
            outline: none;
            text-align: center;
            letter-spacing: 4px;
        }

        input:focus {
            border-color: #20e58a;
            box-shadow: 0 0 0 3px rgba(32,229,138,0.1);
        }

        button {
            border: 0;
            cursor: pointer;
            color: white;
            font-weight: 700;
            border-radius: 14px;
            transition: 0.2s;
        }

        .unlock {
            padding: 0 22px;
            background: linear-gradient(135deg, #20e58a, #119b65);
            box-shadow: 0 10px 25px rgba(32,229,138,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .error {
            color: #ff7070;
            margin-top: 15px;
            height: 20px;
        }

        /* DASHBOARD */

        #dashboard {
            display: none;
        }

        .welcome {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .welcome p {
            color: #8d9bb2;
            margin: 7px 0 0;
        }

        .logout {
            padding: 11px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .balance-card {
            position: relative;
            overflow: hidden;
            padding: 35px;
            min-height: 230px;
            border-radius: 24px;
            background:
                radial-gradient(circle at 85% 20%, rgba(32,229,138,0.22), transparent 35%),
                linear-gradient(135deg, #102c2a, #0c1b2c);
            border: 1px solid rgba(32,229,138,0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .balance-card::after {
            content: "VAULT";
            position: absolute;
            right: -15px;
            bottom: -35px;
            font-size: 130px;
            font-weight: 900;
            color: rgba(255,255,255,0.025);
            pointer-events: none;
        }

        .balance-label {
            color: #91a19f;
            font-size: 14px;
        }

        .balance {
            font-size: clamp(45px, 8vw, 75px);
            font-weight: 900;
            letter-spacing: -3px;
            margin: 15px 0;
            color: #ffffff;
        }

        .account-number {
            color: #7e918d;
            font-size: 13px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .panel {
            padding: 25px;
            border-radius: 20px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .panel h3 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .money-input {
            width: 100%;
            text-align: left;
            letter-spacing: 0;
            margin-bottom: 12px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .add {
            padding: 14px;
            background: #20b878;
        }

        .remove {
            padding: 14px;
            background: #b84452;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        .transaction:last-child {
            border-bottom: 0;
        }

        .transaction small {
            color: #8490a3;
            display: block;
            margin-top: 4px;
        }

        .positive {
            color: #55e7a3;
        }

        .negative {
            color: #ff7070;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translate(-50%, 100px);
            background: #152235;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            transition: 0.3s;
            opacity: 0;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        @media (max-width: 700px) {
            main {
                padding: 22px;
            }

            header {
                padding: 20px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .welcome {
                align-items: flex-start;
                flex-direction: column;
            }

            .code-box {
                flex-direction: column;
            }

            .unlock {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">
            <div class="logo-icon">🔐</div>
            Vault Bank
        </div>

        <div class="secure">
            ● Demo Vault
        </div>
    </header>

    <main>

        <!-- LOCKED SCREEN -->
        <section id="lockedScreen">

            <div class="lock">🔒</div>

            <h1>Vault Locked</h1>

            <p class="subtitle">
                Enter your secret access code to open your demo account.
            </p>

            <div class="code-box">
                <input
                    id="secretCode"
                    type="password"
                    placeholder="SECRET CODE"
                    maxlength="20"
                >

                <button class="unlock" onclick="unlockVault()">
                    UNLOCK
                </button>
            </div>

            <div class="error" id="error"></div>

        </section>


        <!-- DASHBOARD -->
        <section id="dashboard">

            <div class="welcome">
                <div>
                    <h1>Welcome back 👋</h1>
                    <p>Your personal demo banking dashboard.</p>
                </div>

                <button class="logout" onclick="lockVault()">
                    🔒 Lock
                </button>
            </div>


            <div class="balance-card">

                <div class="balance-label">
                    AVAILABLE BALANCE
                </div>

                <div class="balance" id="balance">
                    $0.00
                </div>

                <div class="account-number">
                    DEMO ACCOUNT •••• 4291
                </div>

            </div>


            <div class="controls">

                <div class="panel">

                    <h3>💰 Change Balance</h3>

                    <input
                        id="amount"
                        class="money-input"
                        type="number"
                        step="0.01"
                        placeholder="Enter amount"
                    >

                    <div class="action-buttons">
                        <button class="add" onclick="changeMoney(1)">
                            + Add
                        </button>

                        <button class="remove" onclick="changeMoney(-1)">
                            − Remove
                        </button>
                    </div>

                </div>


                <div class="panel">

                    <h3>📜 Recent Activity</h3>

                    <div id="transactions">

                        <div class="transaction">
                            <div>
                                Account opened
                                <small>Just now</small>
                            </div>

                            <span class="positive">
                                +$0.00
                            </span>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<div class="toast" id="toast">
    Balance updated
</div>


<script>

    /*
        FICTIONAL DEMO BANK

        Secret code:
        314159

        Starting balance:
        $3,141.59
    */

    const SECRET_CODE = "314159";

    let balance = 3141.59;

    function formatMoney(number) {
        return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD"
        }).format(number);
    }

    function unlockVault() {

        const code = document.getElementById("secretCode").value;
        const error = document.getElementById("error");

        if (code === SECRET_CODE) {

            document.getElementById("lockedScreen").style.display = "none";
            document.getElementById("dashboard").style.display = "block";

            updateBalance();

            error.textContent = "";

            showToast("🔓 Vault unlocked");

        } else {

            error.textContent = "Incorrect secret code.";

            document.getElementById("secretCode").value = "";

        }
    }

    function lockVault() {

        document.getElementById("dashboard").style.display = "none";
        document.getElementById("lockedScreen").style.display = "flex";

        document.getElementById("secretCode").value = "";

        showToast("🔒 Vault locked");
    }

    function updateBalance() {

        document.getElementById("balance").textContent =
            formatMoney(balance);
    }

    function changeMoney(direction) {

        const input = document.getElementById("amount");
        const amount = Number(input.value);

        if (!amount || amount <= 0) {

            showToast("Enter a valid amount");

            return;
        }

        balance += amount * direction;

        if (balance < 0) {
            balance = 0;
        }

        updateBalance();

        addTransaction(
            direction === 1 ? amount : -amount
        );

        input.value = "";

        showToast(
            direction === 1
                ? "💰 Money added"
                : "💸 Money removed"
        );
    }

    function addTransaction(amount) {

        const transactions =
            document.getElementById("transactions");

        const transaction =
            document.createElement("div");

        transaction.className = "transaction";

        const positive = amount >= 0;

        transaction.innerHTML = `
            <div>
                ${positive ? "Money added" : "Money removed"}
                <small>Just now</small>
            </div>

            <span class="${positive ? "positive" : "negative"}">
                ${positive ? "+" : "-"}${formatMoney(Math.abs(amount))}
            </span>
        `;

        transactions.prepend(transaction);
    }

    function showToast(message) {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 1800);
    }

    document
        .getElementById("secretCode")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                unlockVault();
            }

        });

</script>

</body>
</html>
```
